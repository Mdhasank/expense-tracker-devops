services:
  
  mongodb:
    image: mongo:8
    container_name: expense-tracker-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
  

  backend:
    build:
      context: ./backend
    container_name: expense-tracker-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_URL: ${CLIENT_URL}
    depends_on:
      - mongodb
    ports:
      - "5000:5000"
  

  frontend:
    build:
      context: ./frontend
    container_name: expense-tracker-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
volumes:
  mongodb_data:
